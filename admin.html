<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paneli i Adminit - HerStory.al</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 40px; display: flex; justify-content: center; }
        .admin-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin: 10px 0 5px; color: #555; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
    <!-- Lidhja me Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="admin-box">
    <h2>Shto Produkt të Ri</h2>
    <form id="add-product-form">
        <label for="prod-name">Emri i Produktit</label>
        <input type="text" id="prod-name" required placeholder="p.sh. Serum Hidratues">

        <label for="prod-price">Çmimi (€ / Lek)</label>
        <input type="number" step="0.01" id="prod-price" required placeholder="p.sh. 15.00">

        <label for="prod-category">Kategoria</label>
        <select id="prod-category">
            <option value="Fytyrë">Fytyrë</option>
            <option value="Trup">Trup</option>
            <option value="Flokë">Flokë</option>
        </select>

        <label for="prod-desc">Përshkrimi</label>
        <textarea id="prod-desc" rows="4" required placeholder="Përshkruaj produktin..."></textarea>

        <label for="prod-img-url">Linku i Imazhit (URL)</label>
        <input type="url" id="prod-img-url" required placeholder="https://shembull.com/foto.jpg">

        <button type="submit">Shto Produktin</button>
    </form>
</div>

<!-- Lidhja me skedarët e tu ekzistues JS -->
<script src="js/supabase-config.js"></script>
<script src="js/admin.js"></script>
<script>
    // Lidhja e formës me funksionin që kemi në js/admin.js
    document.getElementById('add-product-form').addEventListener('submit', handleAddProduct);
</script>

</body>
</html>
