<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerStory - E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cat-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .cat-btn:hover, .cat-btn.active {
            background-color: #92400e !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-amber-50/30 text-gray-800 flex flex-col min-h-screen">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-white border-b border-amber-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-amber-900 tracking-wide">🌸 HerStory</h1>
            
            <div class="flex items-center gap-4">
                <a href="admin.html" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md font-medium">Paneli Admin</a>
                <div class="relative cursor-pointer bg-amber-100 p-2 rounded-full">
                    🛒 <span id="cart-count" class="bg-amber-800 text-white text-xs font-bold px-1.5 py-0.5 rounded-full">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="bg-amber-100/50 py-12 text-center">
        <h2 class="text-3xl font-extrabold text-amber-950">Zbuloni Bukurinë Tuaj Unike</h2>
        <p class="text-amber-800 mt-2">Produkte premium për kujdesin e lëkurës dhe trupit</p>
    </section>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        
        <!-- KATEGORITË (BUTONAT E FILTRIMIT) -->
        <div class="flex flex-wrap gap-2 justify-center mb-8">
            <button type="button" class="cat-btn active bg-amber-200 text-amber-900 px-4 py-2 rounded-lg font-semibold text-sm" onclick="filterCategory('all', this)">Të gjitha</button>
            <button type="button" class="cat-btn bg-amber-200 text-amber-900 px-4 py-2 rounded-lg font-semibold text-sm" onclick="filterCategory('Kremra', this)">Kremra</button>
            <button type="button" class="cat-btn bg-amber-200 text-amber-900 px-4 py-2 rounded-lg font-semibold text-sm" onclick="filterCategory('Parfume', this)">Parfume</button>
            <button type="button" class="cat-btn bg-amber-200 text-amber-900 px-4 py-2 rounded-lg font-semibold text-sm" onclick="filterCategory('Kujdesi per Trupin', this)">Kujdesi për Trupin</button>
        </div>

        <!-- LISTA E PRODUKTEVE -->
        <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Produktet do të ngarkohen këtu nga app.js -->
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-amber-950 text-amber-200 text-center py-6 mt-12 text-sm">
        &copy; 2026 HerStory. Të gjitha të drejtat të rezervuara.
    </footer>

    <!-- SKEDARI I SAKTE I JAVASCRIPT -->
    <script src="js/app.js"></script>
</body>
</html>
